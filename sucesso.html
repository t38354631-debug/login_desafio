
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login realizado | Harley Style</title>

    <link rel="stylesheet" href="sucesso.css">

    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <main class="success-container">

        <div class="background"></div>

        <section class="success-card">

            <div class="brand">
                <h1>HARLEY<span> STYLE</span></h1>
                <p>LIVE TO RIDE</p>
            </div>

            <div class="success-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 12L10 17L20 7"/>
                </svg>
            </div>

            <span class="status">AUTENTICAÇÃO CONCLUÍDA</span>

            <h2>ACESSO<br><span>LIBERADO!</span></h2>

            <p class="description">
                Seu login foi realizado com sucesso.
                Seja bem-vindo à plataforma!
            </p>

            <div class="divider"></div>

            <div class="user-info">
                <span>STATUS DA CONTA</span>
                <strong>
                    <i></i> CONECTADO
                </strong>
            </div>

            <button id="continuar">
                ACESSAR PAINEL
                <span>→</span>
            </button>

            <p class="footer">
                FREEDOM • POWER • ROAD
            </p>

        </section>

        <div class="background-text">
            RIDE YOUR OWN WAY
        </div>

    </main>

    <script src="sucesso.js"></script>

</body>
</html>
