<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
   
    <link rel = "stylesheet" href = "style.css"> 
</head>
<body>


      <!-- ESTRADA E MOTOS HARLEY-DAVIDSON -->
    <div class="estrada">
        <div class="faixas"></div>

        <!-- MOTO 1 (LARANJA - PASSANDO EMBAIXO) -->
        <div class="moto-container moto-1">
            <svg viewBox="0 0 300 140" class="moto-svg">
                <!-- Luz do Farol -->
                <polygon points="235,52 300,30 300,85" fill="rgba(255, 230, 128, 0.35)" />
                <!-- Escapamento Duplo -->
                <rect x="35" y="96" width="95" height="7" rx="3" fill="#b3b3b3" />
                <rect x="30" y="105" width="100" height="7" rx="3" fill="#808080" />
                <!-- Roda Traseira -->
                <g class="roda-gira" style="transform-origin: 65px 102px;">
                    <circle cx="65" cy="102" r="28" fill="#111" stroke="#333" stroke-width="6" />
                    <circle cx="65" cy="102" r="18" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="8 6" />
                    <circle cx="65" cy="102" r="6" fill="#ccc" />
                </g>
                <!-- Roda Dianteira -->
                <g class="roda-gira" style="transform-origin: 225px 102px;">
                    <circle cx="225" cy="102" r="28" fill="#111" stroke="#333" stroke-width="6" />
                    <circle cx="225" cy="102" r="18" fill="none" stroke="#ff6600" stroke-width="3" stroke-dasharray="8 6" />
                    <circle cx="225" cy="102" r="6" fill="#ccc" />
                </g>
                <!-- Para-lamas Laranja -->
                <path d="M 32 95 Q 65 55 98 90 L 90 95 Q 65 66 40 98 Z" fill="#ff6600" />
                <path d="M 192 90 Q 225 55 258 95 L 250 98 Q 225 66 200 95 Z" fill="#ff6600" />
                <!-- Quadro e Garfo -->
                <path d="M 65 102 L 125 102 L 155 68 L 190 52 L 225 102" fill="none" stroke="#555" stroke-width="7" stroke-linejoin="round" />
                <!-- Motor V-Twin -->
                <polygon points="120,98 108,70 125,66 135,88 148,66 164,72 148,98" fill="#d9d9d9" />
                <!-- Tanque Clássico -->
                <path d="M 125 65 Q 158 38 192 52 Q 165 68 125 65 Z" fill="#ff6600" />
                <!-- Banco -->
                <path d="M 78 74 Q 102 78 126 65 L 120 74 Q 98 86 74 80 Z" fill="#1a1a1a" />
                <!-- Guidão Alto -->
                <path d="M 188 52 L 175 24 L 160 22" fill="none" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round" />
                <!-- Farol -->
                <rect x="196" y="46" width="14" height="14" rx="4" fill="#fff" />
            </svg>
        </div>

        <!-- MOTO 2 (CROMADA - PASSANDO NO MEIO) -->
        <div class="moto-container moto-2">
            <svg viewBox="0 0 300 140" class="moto-svg">
                <polygon points="235,52 300,30 300,85" fill="rgba(255, 255, 255, 0.25)" />
                <rect x="35" y="96" width="95" height="7" rx="3" fill="#999" />
                <rect x="30" y="105" width="100" height="7" rx="3" fill="#666" />
                <g class="roda-gira" style="transform-origin: 65px 102px;">
                    <circle cx="65" cy="102" r="28" fill="#111" stroke="#444" stroke-width="6" />
                    <circle cx="65" cy="102" r="18" fill="none" stroke="#ccc" stroke-width="3" stroke-dasharray="8 6" />
                    <circle cx="65" cy="102" r="6" fill="#fff" />
                </g>
                <g class="roda-gira" style="transform-origin: 225px 102px;">
                    <circle cx="225" cy="102" r="28" fill="#111" stroke="#444" stroke-width="6" />
                    <circle cx="225" cy="102" r="18" fill="none" stroke="#ccc" stroke-width="3" stroke-dasharray="8 6" />
                    <circle cx="225" cy="102" r="6" fill="#fff" />
                </g>
                <path d="M 32 95 Q 65 55 98 90 L 90 95 Q 65 66 40 98 Z" fill="#cccccc" />
                <path d="M 192 90 Q 225 55 258 95 L 250 98 Q 225 66 200 95 Z" fill="#cccccc" />
                <path d="M 65 102 L 125 102 L 155 68 L 190 52 L 225 102" fill="none" stroke="#777" stroke-width="7" stroke-linejoin="round" />
                <polygon points="120,98 108,70 125,66 135,88 148,66 164,72 148,98" fill="#eee" />
                <path d="M 125 65 Q 158 38 192 52 Q 165 68 125 65 Z" fill="#cccccc" />
                <path d="M 78 74 Q 102 78 126 65 L 120 74 Q 98 86 74 80 Z" fill="#111" />
                <path d="M 188 52 L 175 24 L 160 22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" />
                <rect x="196" y="46" width="14" height="14" rx="4" fill="#fff" />
            </svg>
        </div>
    </div>
   
    <div class = "login">
        <form id="formLogin">
            <input type="password" id ="senha" placeholder="SUA SENHA" required>
            <input type="text" id = "usuario" placeholder="SEU USUARIO" required>
            <button id = "e" type = "button">Entrar</button>
        </form>
       
            <p id="mensagemErro" class="mensagem-erro"></p>
        
    </div>
     <script src = "script.js"></script>

    

     
</body>

</html>
